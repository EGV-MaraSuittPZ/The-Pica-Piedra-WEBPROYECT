<!DOCTYPE html>

        <div class="col-6 col-lg-3">

            <figcaption>Manga larga con texto pequeño</figcaption>
          </figure>

        <div class="col-6 col-lg-3">
          <figure>
            <img src="../img/item-lg3.jpg" alt="Camiseta negra de manga larga con un texto estampado en blanco" width="600" height="800" class="img-fluid">
